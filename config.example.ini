[llm]
model = qwen-plus
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
api_key = YOUR_API_KEY
query_rewrite_enabled = true

[models]
memory_policy = sequential

# Models are downloaded locally or read from CLOUDCARE_*_PATH environment variables.
# Local model directories from the original project are read-only reusable weights.
[retrieval]
embedding_batch_size = 4
retrieval_k = 20
rerank_k = 5
dense_weight = 0.65
sparse_weight = 0.35
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50

[faq]
# BM25 / same-query reference BM25, clipped to [0,1]. Not a correctness probability.
# 0.60 is a conservative operating point after known missing-fact stress checks.
bm25_threshold = 0.60

[query]
expansions_enabled = true
hyde_enabled = true
max_subqueries = 3
max_queries = 7
