[llm]
model = qwen-plus
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
api_key = YOUR_API_KEY
query_rewrite_enabled = true

[models]
memory_policy = sequential

# Models are downloaded locally or read from CLOUDCARE_*_PATH environment variables.
# Local model directories from the original project are read-only reusable weights.
[retrieval]
embedding_batch_size = 4
retrieval_k = 20
rerank_k = 5
dense_weight = 0.65
sparse_weight = 0.35
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50

[faq]
# Raw BM25 score over FAQ questions. Starting value; not a calibrated probability.
bm25_threshold = 8.0
